# pyproject.toml

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# -------------------
# Project Metadata
# -------------------
[project]
name = "stimside"
dynamic = ["version"]
description = "Stimside simulator to simulate loss and leakage using Stim."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Matt McEwen", email = "mmcewen@google.com" },
    { name = "Ming Li", email = "mliq@google.com" }
]

# Project dependencies are listed here.
dependencies = [
    "numpy>=2",
    "stim>=1.16",
    "sinter>=1.16",
    "pymatching",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "stimside.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stimside" = ["golden_digests.json"]
"stimside._native" = ["*.cpp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src"]
norecursedirs = ["build", "dist", "python_build_stimside", "*.egg-info", ".benchmarks", ".git"]
markers = ["slow: long-running test (> 10 s)"]

